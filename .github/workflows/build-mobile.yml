name: Build Sasha Control Mobile APK
on:
  push:
    branches: [ sasha-control-mobile ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source zip
        shell: bash
        run: |
          cat .mobile-src/part00.txt .mobile-src/part01.txt .mobile-src/part02.txt .mobile-src/part03a.txt .mobile-src/part03b.txt .mobile-src/part03c0.txt .mobile-src/part03c1.txt .mobile-src/part04a.txt .mobile-src/part04b.txt .mobile-src/part04c0.txt .mobile-src/part04c1.txt .mobile-src/part05.txt > mobile-source.b64
          base64 -d mobile-source.b64 > mobile-source.zip
          unzip -t mobile-source.zip
          unzip -q mobile-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: SashaControl_Mobile_1.0
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK into branch
        run: |
          mkdir -p release-apk
          cp SashaControl_Mobile_1.0/app/build/outputs/apk/debug/app-debug.apk release-apk/SashaControl-Mobile-1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release-apk/SashaControl-Mobile-1.0.0.apk
          git commit -m "Build Sasha Control Mobile 1.0 APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: SashaControl-Mobile-APK
          path: release-apk/SashaControl-Mobile-1.0.0.apk
