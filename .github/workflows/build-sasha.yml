name: Build Sasha Control Windows
on:
  push:
    branches: [ sasha-control-build ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Sasha Control source
        shell: pwsh
        run: |
          $b64 = ((Get-Content '.build-v4/part00.txt' -Raw).Trim()) + ((Get-Content '.build-v4/part01.txt' -Raw).Trim()) + ((Get-Content '.build-v4/rest.txt' -Raw).Trim())
          [IO.File]::WriteAllBytes('SashaControl_Final_Build.zip', [Convert]::FromBase64String($b64))
          7z t SashaControl_Final_Build.zip
          7z x SashaControl_Final_Build.zip -y
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build bundled offline voice helper
        shell: pwsh
        working-directory: SashaControl_Final
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller faster-whisper sounddevice numpy
          pyinstaller --onefile --noconsole --name voice_helper --collect-all faster_whisper --collect-all ctranslate2 --collect-all sounddevice --collect-all tokenizers --collect-all huggingface_hub voice/voice_helper.py
          New-Item -ItemType Directory -Force voice-dist | Out-Null
          Copy-Item dist/voice_helper.exe voice-dist/voice_helper.exe
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: SashaControl_Final
        run: npm install
      - name: Validate application
        working-directory: SashaControl_Final
        run: npm run check
      - name: Build installer and portable EXE
        working-directory: SashaControl_Final
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SashaControl-Windows-x64
          path: SashaControl_Final/dist/*.exe
          if-no-files-found: error
          retention-days: 7
