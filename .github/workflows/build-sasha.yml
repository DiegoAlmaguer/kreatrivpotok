name: Build Sasha Control Windows
on:
  push:
    branches: [ sasha-control-build ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Sasha Control source
        shell: pwsh
        run: |
          7z x sasha-control.zip -y
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build voice helper
        shell: pwsh
        working-directory: SashaControl_Final
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller faster-whisper sounddevice numpy
          New-Item -ItemType Directory -Force voice-dist | Out-Null
          pyinstaller --onefile --noconsole --name voice_helper --collect-all faster_whisper --collect-all ctranslate2 --collect-all sounddevice --collect-all tokenizers --collect-all huggingface_hub voice/voice_helper.py
          Copy-Item dist/voice_helper.exe voice-dist/voice_helper.exe
          Remove-Item -Recurse -Force dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: SashaControl_Final
        run: npm install
      - name: Validate JavaScript
        working-directory: SashaControl_Final
        run: npm run check
      - name: Build Windows installer and portable EXE
        working-directory: SashaControl_Final
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SashaControl-Windows-x64
          path: SashaControl_Final/dist/*.exe
          if-no-files-found: error
